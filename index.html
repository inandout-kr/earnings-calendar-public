<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer"><meta name="description" content="기업 실적 발표와 컨퍼런스 콜 월간 일정 및 공개 출처">
<title>실적발표 일정</title><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#calendar">캘린더로 바로가기</a>
<header class="app-header"><div class="header-inner"><div class="brand"><span class="brand-mark" aria-hidden="true">▦</span><div class="brand-name">실적발표 일정</div></div><div class="header-right"><span class="public-label">공개용 일정</span><span id="today-label" class="header-clock">KST</span></div></div></header>
<main class="workspace">
<div id="notice" class="alert" role="status" aria-live="polite" hidden></div>
<div class="workbench">
<section id="calendar" class="calendar-panel" aria-label="실적 발표 캘린더" tabindex="-1">
<div class="panel-top"><div class="calendar-toolbar"><div class="period-control"><h2 id="month-label">월간 일정</h2><button id="previous-month" class="icon-button" aria-label="이전 달" type="button">‹</button><button id="next-month" class="icon-button" aria-label="다음 달" type="button">›</button><button id="today" class="button small" type="button">오늘</button></div><div class="view-switch" aria-label="화면 보기"><button id="month-view" type="button" aria-pressed="true">▦ 월간</button><button id="list-view" type="button" aria-pressed="false">☰ 목록</button></div></div>
<div class="filters"><label class="search-field"><span class="sr-only">기업명·종목코드 검색</span><input id="search" type="search" placeholder="기업명 또는 종목코드 검색" autocomplete="off"></label><label class="sr-only" for="company-filter">기업</label><select id="company-filter"><option value="all">모든 기업</option></select><label class="sr-only" for="status-filter">확인 상태</label><select id="status-filter"><option value="all">모든 상태</option><option value="confirmed">공식확정</option><option value="reported">보고된 확정 · 확인대기</option><option value="estimated">추정</option><option value="conflict">충돌</option><option value="unscheduled">미정</option><option value="cancelled">취소</option></select><label class="filter-previous"><input id="show-superseded" type="checkbox">이전 일정 <span id="superseded-count">(0)</span></label></div></div>
<div class="filter-summary"><span id="result-count" aria-live="polite">일정을 불러오는 중입니다.</span><button id="reset-filters" class="text-button" type="button">필터 초기화</button></div>
<div id="results" aria-busy="true"><p class="empty-state">공개 일정을 불러오고 있습니다.</p></div>
<section id="range-section" class="range-section" hidden><h3>주간·기간으로 알려진 일정</h3><p>개별 발표일이 확정되지 않아 특정 날짜 칸에 배치하지 않습니다.</p><div id="range-list" class="range-list"></div></section>
<div class="legend"><span><i></i>공식확정</span><span><i class="pending"></i>보고된 확정 · 공식 확인대기</span><span><i class="estimated"></i>추정</span><span><i class="unknown"></i>미정·충돌은 오른쪽에 별도 표시</span></div>
</section>
<aside class="side-column" aria-label="확인이 필요한 일정"><section class="side-card"><div class="side-title"><h2>날짜·범위 미확정</h2><span id="undated-count" class="count">—</span></div><p class="side-note">월 범위 밖에서도 계속 표시합니다.</p><div id="undated-list" class="side-list"></div></section><section class="side-card"><div class="side-title"><h2>근거 충돌</h2><span id="conflict-count" class="count">—</span></div><p class="side-note">특정 날짜로 확정하지 않고 함께 보존합니다.</p><div id="conflict-list" class="side-list"></div></section></aside>
</div>
</main>
<dialog id="event-dialog" class="event-dialog" aria-labelledby="event-detail-title"><div class="dialog-heading"><div><span class="eyebrow">일정 근거</span><h2 id="event-detail-title"></h2><p id="event-detail-caption"></p></div><button id="close-dialog" class="icon-button" aria-label="상세 닫기" type="button">×</button></div><div id="event-detail-content" class="dialog-content"></div></dialog>
</body></html>
